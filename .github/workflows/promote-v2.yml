name: Promote v2.0 to root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote Basebreaker v2.0 to repository root
        run: |
          set -euo pipefail
          git config user.name "kxz0tn"
          git config user.email "kxz0tn@users.noreply.github.com"

          if [ ! -f basebreaker-v2.0/index.html ]; then
            echo "basebreaker-v2.0/index.html missing"
            ls -la
            exit 1
          fi

          cp -f basebreaker-v2.0/index.html ./index.html
          cp -f basebreaker-v2.0/LICENSE ./LICENSE
          cp -f basebreaker-v2.0/README.md ./README.md
          rm -rf css js
          mv basebreaker-v2.0/css css
          mv basebreaker-v2.0/js js
          rm -rf basebreaker-v2.0

          python3 - << 'PY'
          from pathlib import Path
          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          if text.startswith("# Basebreaker v2.0"):
              text = "# Basebreaker" + text[len("# Basebreaker v2.0"):]
          needle = "Open `index.html`"
          live = "**Play live:** https://kxz0tn.github.io/basebreaker/\n\n"
          if needle in text and "kxz0tn.github.io/basebreaker" not in text:
              text = text.replace(needle, live + needle, 1)
          p.write_text(text, encoding="utf-8")
          PY

          rm -f .github/workflows/promote-v2.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Promote Basebreaker v2.0 to repository root for GitHub Pages"
          git push
