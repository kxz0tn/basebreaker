<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>SIGNAL LOST — BASEBREAKER</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000;
        color: #fff;
        font-family: ui-monospace, monospace;
      }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .frame {
        width: min(560px, 100%);
        border: 1px solid #fff;
        padding: 40px 36px 32px;
        position: relative;
      }
      .frame::before,
      .frame::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        border: 1px solid #fff;
      }
      .frame::before {
        top: -1px;
        left: -1px;
        border-right: 0;
        border-bottom: 0;
      }
      .frame::after {
        right: -1px;
        bottom: -1px;
        border-left: 0;
        border-top: 0;
      }
      .kicker {
        letter-spacing: 0.45em;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.45);
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 16px;
        letter-spacing: 0.22em;
        font-size: clamp(28px, 7vw, 44px);
        text-transform: uppercase;
      }
      p {
        margin: 0 0 28px;
        letter-spacing: 0.08em;
        line-height: 1.55;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
        font-size: 13px;
      }
      a {
        display: inline-block;
        border: 1px solid #fff;
        color: #fff;
        text-decoration: none;
        padding: 12px 22px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        font-weight: 700;
        font-size: 12px;
      }
      a:hover,
      a:focus-visible {
        background: #fff;
        color: #000;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="kicker">404 · CORRIDOR SEALED</div>
      <h1>Signal Lost</h1>
      <p>This sector is not on the Helix Arc map. Return to the vault and initiate a run.</p>
      <a href="./">Return to Basebreaker</a>
    </div>
  </body>
</html>
